<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Task Hunt - Tahoe 2027 (prototype)</title>
<style>
:root{--bg:#0b1624;--card:#13243a;--card2:#1a3050;--ink:#eaf2fb;--mut:#8ea6c2;--line:#25405f;--accent:#6fd3ff;--ok:#43d68a;--bad:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:radial-gradient(1200px 500px at 50% -200px,#16385e 0,var(--bg) 70%) no-repeat,var(--bg);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 96px}
header.top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 2px 10px}
header.top h1{font-size:18px;margin:0;letter-spacing:.2px}
header.top small{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer}
button.pri{background:var(--accent);color:#06233a;border-color:var(--accent);font-weight:700}
button.ok{background:var(--ok);color:#052a17;border-color:var(--ok);font-weight:700}
button.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--ink);background:#0d1c2f;border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#0d1c2f;border:1px solid var(--line);color:var(--mut);margin-right:4px}
.chip.pts{color:var(--accent);border-color:#2a5b7a}
.chip.neg{color:var(--bad);border-color:#7a2e2e}
.chip.warn{color:var(--warn);border-color:#7a6226}
.chip.ok{color:var(--ok);border-color:#1f6b46}
.seg{display:flex;background:#0d1c2f;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px}
.seg button.on{background:var(--card2);color:var(--ink);font-weight:700}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#0a1422ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bar .in{display:flex;gap:2px;width:100%;max-width:520px}
nav.bar button{flex:1;border:0;background:transparent;color:var(--mut);font-size:11px;padding:6px 2px;position:relative}
nav.bar button b{display:block;font-size:19px;line-height:1.1}
nav.bar button.on{color:var(--accent)}
.badge{position:absolute;top:0;right:18%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.banner{border-radius:14px;padding:10px 12px;margin:10px 0;border:1px solid}
.banner.ping{background:#3a2a0a;border-color:var(--warn)}
.banner.mult{background:#10392a;border-color:var(--ok)}
.banner.info{background:#1a3050;border-color:var(--line)}
.big{font-size:28px;font-weight:800}
.bar-bg{height:10px;border-radius:99px;background:#0d1c2f;overflow:hidden}
.bar-fg{height:100%;border-radius:99px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.thumbs img,.thumbs video{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000}
.thumbs.big img,.thumbs.big video{width:48%;height:auto;max-height:260px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:80}
#modal.on{display:flex}
#modal .sheet{background:var(--card);border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--line);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px 16px 28px}
#toasts{position:fixed;top:8px;left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#0a1422;border:1px solid var(--accent);color:var(--ink);padding:9px 14px;border-radius:12px;max-width:90%;box-shadow:0 6px 24px #0008;pointer-events:auto}
svg.map{width:100%;height:auto;background:#0f2238;border-radius:14px;border:1px solid var(--line);touch-action:manipulation}
@keyframes pulse{0%{r:12;opacity:.9}100%{r:42;opacity:0}}
.pulse{animation:pulse 1.6s infinite;fill:none;stroke:var(--warn);stroke-width:2}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.sw{position:relative;display:inline-block;flex:0 0 46px;width:46px;min-width:46px;height:28px;margin:0}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;padding:0;border:0;left:0;top:0;z-index:2;cursor:pointer}
.sw span{position:absolute;inset:0;background:#0d1c2f;border:1px solid var(--line);border-radius:99px;transition:.15s}
.sw span:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:var(--mut);border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--ok);border-color:var(--ok)}
.sw input:checked+span:before{transform:translateX(18px);background:#06331c}
.calmap{width:100%;display:block;border-radius:12px;background:#0d1c2f;touch-action:manipulation}
.cgrp{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#233f60;color:#fff;font-size:12px;font-weight:700;flex:0 0 24px}
.chip.warn{background:#3a2a05;color:var(--warn);border-color:var(--warn)}
.chip.badc{background:#3a1010;color:var(--bad);border-color:var(--bad)}
header.top h1{white-space:nowrap}
header.top small{white-space:nowrap;display:block}
.pill{white-space:nowrap;min-height:34px;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
body.easy .top .pill{font-size:14px;padding:6px 12px;min-height:40px}
button[data-act^=g]{white-space:nowrap}
.row>button.grow{min-width:0;padding-left:8px;padding-right:8px}
.sosbtn{width:48px;height:48px;font-size:24px;opacity:.92}
main,#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.easy{font-size:18px}
body.easy button,body.easy .btn{padding:13px 16px;font-size:17px}
body.easy button.sm{padding:10px 14px;font-size:15px}
body.easy .small{font-size:14px}
body.easy .chip{font-size:13px;padding:3px 10px}
body.easy nav.bar button{font-size:13px}
body.easy nav.bar button b{font-size:23px}
body.easy input,body.easy select,body.easy textarea{font-size:17px;padding:12px}
body.easy .card{padding:14px}
.demo{position:fixed;right:8px;bottom:78px;z-index:40}
.demo button{border-radius:999px;box-shadow:0 4px 16px #0008}
.banner.flash{background:#3a1030;border-color:#ff5fd2;animation:flp 1.4s ease-in-out infinite}
@keyframes flp{0%,100%{box-shadow:0 0 0 0 #ff5fd255}50%{box-shadow:0 0 14px 3px #ff5fd2aa}}
#edge{position:fixed;inset:0;pointer-events:none;z-index:85;opacity:0;transition:opacity .4s}
#edge.on{opacity:1;animation:edgep 1.8s ease-in-out infinite}
@keyframes edgep{0%,100%{box-shadow:inset 0 0 16px 4px rgba(140,255,170,.35)}50%{box-shadow:inset 0 0 44px 14px rgba(140,255,170,.85)}}
@media (prefers-reduced-motion:reduce){#edge.on{animation:none;box-shadow:inset 0 0 30px 8px rgba(140,255,170,.6)}.banner.flash{animation:none}}
button.boostbar{position:sticky;top:6px;z-index:30;width:100%;display:flex;justify-content:space-between;align-items:center;background:#10392a;border:1px solid var(--ok);border-radius:12px;padding:8px 12px;margin:6px 0;box-shadow:0 4px 14px #0007}
.ptr{width:46px;height:46px;flex:none;transition:transform .25s}
.mapwrap{position:relative}
.fsbtn{position:absolute;top:8px;right:8px;background:#0a1422ee;border:1px solid var(--accent);color:var(--ink);font-weight:700;padding:7px 11px;border-radius:10px;box-shadow:0 3px 12px #0009}
#fsmap{position:fixed;inset:0;z-index:70;background:#0b1624;display:none;flex-direction:column}
#fsmap.on{display:flex}
#fsmap .fsbar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px calc(8px);background:#0a1422;border-bottom:1px solid var(--line);flex-wrap:wrap}
#fsmap .fsbar button{padding:8px 12px}
#fsstage{flex:1;min-height:0;touch-action:none;cursor:grab}
#fsstage svg.map{width:100%;height:100%;border-radius:0;border:0}
.sosbtn{position:fixed;left:10px;bottom:78px;z-index:40;width:50px;height:50px;border-radius:50%;background:#c0392b;color:#fff;border:2px solid #fff;font-size:28px;font-weight:900;padding:0;line-height:1;box-shadow:0 4px 16px #0009}
.banner.sos{background:#4a1111;border-color:#ff5a5a;position:sticky;top:0;z-index:31;animation:sosp 1.2s ease-in-out infinite}
@keyframes sosp{0%,100%{box-shadow:0 0 0 0 #ff5a5a55}50%{box-shadow:0 0 16px 4px #ff5a5acc}}
#reveal{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;background:radial-gradient(900px 600px at 50% 20%,#1b3d66,#0b1624 70%);color:#fff}
#reveal.on{display:flex}
.rv-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.rv{max-width:520px;width:100%;animation:rvin .7s ease both}
@keyframes rvin{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.rv-e{font-size:64px;line-height:1.1}.rv-t{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:6px 0}
.rv-w{font-size:40px;font-weight:900;margin:8px 0;line-height:1.1}.rv-b{font-size:26px;font-weight:800}.rv-s{color:var(--mut);margin:6px 0 14px}
.rv-rows{text-align:left;margin-top:10px}.rv-row{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-radius:10px;background:#0d1c2f99;margin:5px 0}
.rv-bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0a1422ee;flex-wrap:wrap}
.rv-bar button{padding:12px 16px;font-size:16px}
.conf{position:absolute;top:-10px;width:10px;height:16px;opacity:.9;animation:confall linear infinite}
@keyframes confall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.rv,.banner.sos{animation:none}.conf{display:none}}
</style>
</head>

function pingReward(p,rank,teamId,now){

}

function haversine(a,b,c,d){ const R=6371000,p=Math.PI/180,dl=(c-a)*p,dg=(d-b)*p,x=Math.sin(dl/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function distYd(loc,sp){ const c=S.calib&&S.calib[sp.id]; if(loc&&loc.lat!=null&&c) return haversine(loc.lat,loc.lng,c.lat,c.lng)*1.09361; return dist(loc,sp); }
function bearingTo(loc,sp){
  const c=S.calib&&S.calib[sp.id];
  if(loc&&loc.lat!=null&&c){ const p=Math.PI/180, y=Math.sin((c.lng-loc.lng)*p)*Math.cos(c.lat*p), x=Math.cos(loc.lat*p)*Math.sin(c.lat*p)-Math.sin(loc.lat*p)*Math.cos(c.lat*p)*Math.cos((c.lng-loc.lng)*p); return (Math.atan2(y,x)/p+360)%360; }

function shrink(file){
  return new Promise(res=>{ const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,420/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res({kind:'image',src:c.toDataURL('image/jpeg',.6)}); }; im.onerror=()=>res(null); im.src=r.result; };
    r.onerror=()=>res(null); r.readAsDataURL(file); });
}

function idb(){ return _db||(_db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('taskhunt',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } })); }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); return true; }catch(e){ return false; } }
async function idbGet(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ return undefined; } }
async function idbDel(k){ try{ const db=await idb(); await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }

function openSubmit(id){
  const t0=task(id); if(t0&&t0.flash&&t0.flash.deadline<Date.now()) return toast('Time is up on that flash task.');
  if(!draft||draft.taskId!==id) draft={taskId:id,note:'',items:[]};
  persistDraft(); renderSubmit();
}
function renderSubmit(){
  const t=task(draft.taskId), inperson=t.kind==='inperson', need=inperson?0:t.need, n=draft.items.length;
  const cur=$('#sn'); if(cur) draft.note=cur.value;
  const hasCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  const acc=t.kind==='video'?'video/*':'image/*';
  openModal(`<h3 style="margin:0 0 4px">${esc(t.text)}</h3><div class="mut small" style="margin-bottom:8px">Proof: ${esc(t.label)}${multFor(me.teamId)>1?` · ⚡ ${multFor(me.teamId)}× locked in`:''}</div>
   ${inperson?`<div class="banner info small">This one is checked in person. Find the judge named on the card, then send the request so they can approve it.</div>`:`
   <div class="thumbs">${draft.items.map((it,i)=>`<div style="position:relative">${it.kind==='video'?`<video src="${itemSrc(it)}" muted playsinline></video>`:`<img src="${itemSrc(it)}" alt="">`}<button class="sm bad" style="position:absolute;top:2px;right:2px;padding:0 7px;background:#0b1624cc" data-act="rmitem" data-i="${i}">×</button></div>`).join('')}</div>
   <div class="small ${n>=need?'':'mut'}" style="margin-bottom:6px">${n} of ${need} added</div>
   <div class="row" style="flex-wrap:wrap">
    ${hasCam?`<button data-act="cam" data-v="${t.kind==='video'?'video':'photo'}">${t.kind==='video'?'🎥 Record video':'📷 Take photo'}</button>`:''}
    <label class="btn">📁 ${hasCam?'Camera app / gallery':'Add from phone'}<input type="file" id="sf" hidden accept="${acc}" ${need>1?'multiple':''}></label></div>
   <div class="small mut" style="margin-top:6px">Switching to your camera app is fine: your note and photos here are saved.</div>`}
   <label>Note for the judge (optional)</label><textarea id="sn" maxlength="140">${esc(draft.note)}</textarea>
   <div id="se" class="small" style="color:var(--bad);margin-top:6px"></div>
   <div class="row" style="margin-top:10px"><button class="ghost grow" data-act="mclose">Save for later</button><button class="pri grow" data-act="sendproof">${online()?'Send':'Save to send'}</button></div>
   ${n||draft.note?`<button class="ghost small" style="width:100%;margin-top:8px;color:var(--mut)" data-act="discard">Discard this draft</button>`:''}`);
}
async function addFiles(files){
  const t=task(draft.taskId);
  for(const f of files){
    if(f.type.startsWith('video/')){ if(t.kind==='photo') continue; draft.items.push({kind:'video',blob:f,type:f.type}); }
    else { if(t.kind==='video') continue; const m=await shrink(f); if(m) draft.items.push(m); }
  }
  persistDraft(); renderSubmit();
}
async function openCam(mode){
  const cur=$('#sn'); if(cur) draft.note=cur.value;
  camState={mode,facing:'environment',rec:null,chunks:[],stream:null,secs:0,timer:null};
  openModal(`<div class="row sp"><b>${mode==='photo'?'Take a photo':'Record a video'}</b><span class="mut small" id="camt"></span></div>
   <video id="cam" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:55vh"></video>
   <div id="cerr" class="small" style="color:var(--bad);margin-top:6px"></div>
   <div class="row sp" style="margin-top:10px"><button data-act="camback">Back</button>
   ${mode==='photo'?`<button class="pri" data-act="snap">Capture</button>`:`<button class="pri" id="recbtn" data-act="rec">Start recording</button>`}
   <button data-act="flip">Flip</button></div>`);
  await startStream();
}
async function startStream(){
  stopStream();
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camState.facing}},audio:camState.mode==='video'});
    if(!camState){ st.getTracks().forEach(t=>t.stop()); return; }
    camState.stream=st; const v=$('#cam'); if(v) v.srcObject=st;
  }catch(e){ const el=$('#cerr'); if(el) el.textContent='Camera is not available here ('+(e.name||'error')+'). Go back and use the camera app / gallery button instead.'; }
}
function stopStream(){ if(camState&&camState.stream){ camState.stream.getTracks().forEach(t=>t.stop()); camState.stream=null; } }
function snap(){
  const v=$('#cam'); if(!v||!v.videoWidth){ const el=$('#cerr'); if(el) el.textContent='Camera is not ready yet.'; return; }
  const k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement('canvas'); c.width=v.videoWidth*k; c.height=v.videoHeight*k;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height); draft.items.push({kind:'image',src:c.toDataURL('image/jpeg',.7)}); persistDraft(); camBack();
}
function toggleRec(){
  if(camState.rec){ camState.rec.stop(); return; }
  if(!camState.stream||typeof MediaRecorder==='undefined'){ $('#cerr').textContent='Recording is not supported here.'; return; }
  const mt=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||'';
  const rec=new MediaRecorder(camState.stream, mt?{mimeType:mt,videoBitsPerSecond:1500000}:undefined); camState.chunks=[];
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) camState.chunks.push(e.data); };
  rec.onstop=()=>{ clearInterval(camState.timer); const blob=new Blob(camState.chunks,{type:rec.mimeType||mt||'video/webm'}); camState.rec=null; draft.items.push({kind:'video',blob,type:blob.type}); persistDraft(); camBack(); };
  rec.start(); camState.rec=rec; camState.secs=0; $('#recbtn').textContent='Stop';
  camState.timer=setInterval(()=>{ camState.secs++; const el=$('#camt'); if(el) el.textContent=camState.secs+'s / 20s'; if(camState.secs>=20) rec.stop(); },1000);
}
function camBack(){
  if(camState){ if(camState.rec){ camState.rec.onstop=null; try{ camState.rec.stop(); }catch(e){} } clearInterval(camState.timer); }
  stopStream(); camState=null; renderSubmit();
}
function commitSub(sub,items){
  sub.media=items.map(it=>it.kind==='video'?{kind:'video',src:itemSrc(it)}:{kind:'image',src:it.src});
  S.subs.push(sub); const t=task(sub.taskId);
  ev(`${team(sub.teamId).short} sent proof: ${t.text.slice(0,50)}`,['judge','leader'],{});
}
async function sendProof(){
  const t=task(draft.taskId), cur=$('#sn'); if(cur) draft.note=cur.value.trim();
  if(t.flash&&Date.now()>t.flash.deadline){ $('#se').textContent='Time is up on this flash task.'; return; }
  if(t.kind!=='inperson' && draft.items.length<t.need){ $('#se').textContent=`Add ${t.need} ${t.need>1?'files':'file'} first (you have ${draft.items.length}).`; return; }
  const sub={id:uid(),taskId:t.id,teamId:me.teamId,player:me.name,ts:Date.now(),mult:multFor(me.teamId),note:draft.note,status:'pending'};
  const items=draft.items.slice(0,Math.max(t.need,1)).map(plain);
  if(!online()){ outbox.push({oid:uid(),sub,items}); await idbSet('outbox',outbox); clearDraft(); closeModal(); render(); toast('Saved on your phone. It sends when you have signal.'); return; }
  S=load()||S; commitSub(sub,items); clearDraft(); closeModal(); save(); toast('Sent to the judges.');
}
async function flushOutbox(){
  if(flushing||!outbox.length||!online()) return; flushing=true;
  S=load()||S; const n=outbox.length; outbox.forEach(o=>commitSub(o.sub,o.items)); outbox=[]; await idbSet('outbox',outbox); flushing=false;
  save(); toast(n+' saved proof'+(n>1?'s':'')+' sent to the judges.');
}
window.addEventListener('online',()=>{ flushOutbox(); render(); });
window.addEventListener('offline',()=>render());

function decide(id,status,pts,label,note){
  const s=S.subs.find(x=>x.id===id); if(!s||s.status!=='pending') return;
  s.status=status; s.pts=pts||0; s.label=label||''; s.note=note||s.note||''; s.judge=me.name; s.jts=Date.now();
  const t=task(s.taskId), tm=team(s.teamId);
  if(status==='approved') ev(`${tm.short} ${pts<0?'lost':'scored'} ${Math.abs(pts)} on: ${t.text.slice(0,48)}`,['all']);
  else ev(`${tm.short}: "${t.text.slice(0,40)}" was rejected${note?' ('+note+')':''}`,['team:'+s.teamId,'leader','judge']);
  save();
}
function checkin(id){
  S=load()||S;
  const p=S.pings.find(x=>x.id===id); if(!p||p.deadline<Date.now()) return toast('Too late, that ping ended.');
  if(p.checkins&&p.checkins[me.teamId]) return;
  const sp=SPOTS.find(s=>s.id===p.spot), loc=S.locs[me.key];
  if(!loc) return toast('We do not have your location yet. Open Phone setup and allow precise location.');
  if(!shareNote && Date.now()-loc.ts>120000) return toast('Your location is out of date. Wait a few seconds for a new GPS fix, then try again.');
  const d=distYd(loc,sp);
  if(d>p.zone) return toast(`You are about ${Math.round(d)} yards from ${sp.name}. Get within ${p.zone} yards.${loc.acc&&loc.acc>p.zone*.9144?' Your GPS is only accurate to ±'+Math.round(loc.acc)+' m right now.':''}`);
  const r=claimPing(me.teamId,p); if(!r.ok) return toast(r.msg);
  save(); toast(r.msg,'claim');
}

/* ================= IMPORT / EXPORT TASKS ================= */
const CSV_COLS=['id','type','tier','text','points','fail','proof','label','outcomes','flag','files','on'];
let imp={text:'',res:null};
function csvCell(v,d){ v=String(v==null?'':v); const need=d===','?/[",\n]/.test(v):/[\t\n"]/.test(v); return need?'"'+v.replace(/"/g,'""')+'"':v; }
function tasksTable(d){
  const rows=[CSV_COLS]; S.tasks.filter(x=>!x.flash).forEach(x=>{ const ch=x.type==='challenge';
    rows.push([x.id,x.type,x.tier||1,x.text,ch?Math.max(...x.outcomes.map(o=>o.pts)):x.pts,'',x.kind,x.label,ch?x.outcomes.map(o=>o.label+':'+o.pts).join('|'):'',x.flag||'',x.need||1,x.off?'no':'yes']); });
  return rows.map(r=>r.map(c=>csvCell(c,d)).join(d)).join('\n');
}
function parseTable(txt){
  txt=txt.replace(/\r/g,''); const d=txt.split('\n')[0].includes('\t')?'\t':','; const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"'&&cur==='') q=true; else if(c===d){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  row.push(cur); rows.push(row); return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function parseTasks(txt){
  const rows=parseTable(txt), errs=[], items=[]; if(!rows.length) return {items,errs:['Nothing to import.']};
  let cols=CSV_COLS.slice(1), start=0; const h=rows[0].map(c=>String(c).trim().toLowerCase()); if(h.includes('text')){ cols=h; start=1; }
  rows.slice(start).forEach((r,i)=>{
    const line=i+start+1, g=k=>{ const ix=cols.indexOf(k); return ix<0?'':String(r[ix]==null?'':r[ix]).trim(); }, bad=m=>{ errs.push(`Row ${line}: ${m}`); };
    let type=g('type').toLowerCase(); type=type.startsWith('c')?'challenge':type.startsWith('t')?'task':''; const text=g('text');
    if(!text) return bad('no text'); if(!type) return bad('type must be task or challenge');
    const pts=parseInt(g('points'),10); let tier=parseInt(g('tier'),10)||1; tier=Math.max(1,Math.min(3,tier));
    const pr=g('proof').toLowerCase().replace(/[^a-z]/g,''); const kind=pr===''?'photo':/^(vid)/.test(pr)?'video':/^(ph|pic)/.test(pr)?'photo':/^(in|per|see|judge)/.test(pr)?'inperson':'';
    if(!kind) return bad('proof must be photo, video or inperson');
    let outcomes=null;
    if(type==='challenge'){ const oc=g('outcomes');
      if(oc){ outcomes=oc.split('|').map(p=>{ const m=p.split(':'); return {label:m.slice(0,-1).join(':').trim()||'Result',pts:parseInt(m[m.length-1],10)}; }); if(outcomes.some(o=>isNaN(o.pts))) return bad('outcomes must look like Success:5|Failed:-1'); }
      else { if(isNaN(pts)) return bad('challenge needs points'); const f=parseInt(g('fail'),10); outcomes=[{label:'Success',pts},{label:'Failed',pts:isNaN(f)?0:f}]; } }
    else if(isNaN(pts)) return bad('task needs points');
    items.push({id:g('id'),type,tier,text,pts,outcomes,kind,label:g('label')||(kind==='photo'?'Photo':kind==='video'?'Video':'See a judge'),flag:g('flag'),need:Math.max(1,parseInt(g('files'),10)||1),off:/^(no|n|false|0|off)$/i.test(g('on'))});
  });
  return {items,errs};
}
const findMatch=it=>S.tasks.find(t=>!t.flash&&it.id&&t.id===it.id)||S.tasks.find(t=>!t.flash&&t.type===it.type&&t.text.toLowerCase()===it.text.toLowerCase());
function applyImport(items){

function onTrace(p){

async function recordSpot(id){
  if(!navigator.geolocation){ calib.msg='GPS is not available in this browser.'; renderCalib(); return; }
  calib.busy=id; calib.prog=0; calib.msg=''; renderCalib(); const pts=[];

    try{ const c=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:true,maximumAge:0,timeout:15000})); pts.push(c); }catch(e){ break; }
    calib.prog=i+1; renderCalib(); if(i<4) await sleep(1000);
  }
  calib.busy=null;
  if(!pts.length){ calib.msg='Could not get a GPS reading. Check location permission and try outside.'; renderCalib(); return; }
  const avg=k=>pts.reduce((a,p)=>a+p[k],0)/pts.length;
  S=load()||S; S.calib[id]={lat:avg('latitude'),lng:avg('longitude'),acc:Math.min(...pts.map(p=>p.accuracy)),n:pts.length,ts:Date.now()};

}

  snd('request');
  openModal(`<h3 style="margin:0 0 6px">${esc(h.byName||'Josh')} wants to start a hunt with you</h3>
   <div class="mut" style="margin-bottom:10px">Kids will see where you are on their map, updated every 30 seconds, and race to find you. When a team finds you, show them the code on your screen.</div>
   <div class="banner info small">Reward for the team that finds you: <b>${hrew(h)}</b>. Tapping Okay also turns on your location sharing.</div>
   <div class="row" style="margin-top:12px"><button class="grow" data-act="hnotnow" data-id="${h.id}">Not now</button><button class="pri grow" data-act="hokay" data-id="${h.id}">Okay, start</button></div>`);
}
/* Every 30 s the hunted leader's phone copies their location to the public "ping". Demo leaders are driven by whichever phone is open. */
function publishHuntPings(){
  if(!me) return;
  const n=Date.now(); let ch=false;
  activeHunts().forEach(h=>{
    const L=S.leaders[h.leaderKey], mine=me.key===h.leaderKey;
    if(!(mine||(L&&L.demo))) return;
    if(n-((S.huntPos[h.id]||{}).ts||0)<30000) return;
    const loc=S.locs[h.leaderKey]; if(!loc) return;
    if(L&&L.demo){ loc.x=Math.max(10,Math.min(MW-10,loc.x+(Math.random()-.5)*60)); loc.y=Math.max(10,Math.min(MH-10,loc.y+(Math.random()-.5)*60)); loc.ts=n; }
    S.huntPos[h.id]={x:loc.x,y:loc.y,ts:n}; ch=true;
  });
  if(ch) save();
}
function claimHunt(teamId,id,code){
  S=load()||S; const h=S.hunts.find(x=>x.id===id);
  if(!h||h.state!=='live'||!S.gameOn) return {ok:false,msg:'This hunt is not live right now.'};
  h.claims=h.claims||{}; h.tries=h.tries||{};
  if(h.claims[teamId]) return {ok:false,msg:'Your team already found them.'};
  const n=Date.now(), t=h.tries[teamId]||{n:0,lock:0};
  if(t.lock>n) return {ok:false,msg:'Too many tries. Wait '+mmss(t.lock-n)+'.'};
  if(String(code)!==hcode(h)){
    const used=h.codes.slice(0,h.ci).includes(String(code));
    t.n++; let msg=used?'That code was already used by another team. Find them for their new code.':'That is not the right code.';
    if(t.n>=3){ t.lock=n+60000; t.n=0; msg='Wrong again. Locked for 1 minute.'; }
    h.tries[teamId]=t; save(); return {ok:false,msg};
  }
  h.tries[teamId]={n:0,lock:0}; h.claims[teamId]=n; h.ci++;
  let msg;
  if(h.reward.type==='points'){ const pts=Math.round(h.reward.pts*multFor(teamId)); S.bonus.push({teamId,pts,reason:'Found '+h.leaderName,ts:n}); msg=`Found ${h.leaderName}! +${pts}`; }
  else { const cur=S.mult.teams[teamId], live=cur&&cur.until>n; S.mult.teams[teamId]={x:Math.max(live?cur.x:1,h.reward.x),until:Math.max(live?cur.until:0,n+h.reward.min*60000)}; msg=`Found ${h.leaderName}! ${h.reward.x}× points for ${h.reward.min} min`; }
  ev(`🔍 ${team(teamId).short} found ${h.leaderName} (${hrew(h)})`,['all']);
  if(h.ci>=h.codes.length||Object.keys(h.claims).length>=S.teams.length){ h.state='done'; ev(`Every team has found you. The hunt is over. Thank you!`,['key:'+h.leaderKey]); }
  else ev(`${team(teamId).short} found you. Your next code is ${hcode(h)}.`,['key:'+h.leaderKey],{snd:'ok'});
  save(); return {ok:true,msg};
}
function openClaim(id){
  const h=S.hunts.find(x=>x.id===id); if(!h) return;
  openModal(`<h3 style="margin:0 0 4px">Found ${esc(h.leaderName)}?</h3><div class="mut small">Ask them to show the 4-digit code on their phone. Reward: ${hrew(h)}.</div>
   <input id="hc-code" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:28px;text-align:center;letter-spacing:8px;margin-top:10px" placeholder="0000">
   <div id="hc-err" class="small" style="color:var(--bad);margin-top:6px"></div>
   <div class="row" style="margin-top:10px"><button class="ghost grow" data-act="mclose">Cancel</button><button class="pri grow" data-act="hsubmit" data-id="${id}">Check code</button></div>`);
}
function leaderHuntCards(){
  const mine=S.hunts.filter(h=>h.leaderKey===me.key&&['live','paused','done'].includes(h.state)); if(!mine.length) return '';
  return mine.map(h=>{
    const pos=S.huntPos[h.id], sharing=!!S.locs[me.key], claims=Object.keys(h.claims||{}).length;
    if(h.state==='done') return `<div class="banner mult"><b>✅ Hunt finished.</b> <span class="small">All teams found you. Thank you!</span></div>`;
    return `<div class="banner ping"><div class="row sp"><div><b>🎯 You are being hunted</b><div class="small">${h.state==='live'?'Show this code only to a team standing in front of you.':'Paused by Josh.'}</div></div>
      <div class="big" style="letter-spacing:5px">${esc(hcode(h))}</div></div>
      <div class="small" style="margin-top:6px">Code ${Math.min(h.ci+1,h.codes.length)} of ${h.codes.length} · Reward: ${hrew(h)} · ${claims} of ${S.teams.length} teams found you</div>
      <div class="small" style="margin-top:4px">${!sharing?'⚠ Turn on Share my location below so kids can find you.':pos?`Last ping went out ${ago(pos.ts)}. Next in <b data-until="${pos.ts+30000}">${mmss(pos.ts+30000-Date.now())}</b>.`:'Your first ping goes out in a moment.'}</div></div>`;
  }).join('');
}
function ownerSummary(){
  if(!me.owner) return '';
  const top=S.teams.map(t=>({t,s:scoreOf(t.id).total})).sort((a,b)=>b.s-a.s)[0];
  const sharing=Object.values(S.locs).filter(l=>Date.now()-l.ts<120000).length;
  const stat=(n,l,c)=>`<div class="card" style="margin:0;text-align:center;padding:10px"><div class="big" ${c?`style="color:${c}"`:''}>${n}</div><div class="small mut">${l}</div></div>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0">${stat(pendingCount(),'waiting for judges',pendingCount()?'var(--warn)':'')}${stat(top.s+' pts','leading: '+esc(top.t.short))}${stat(sharing,'phones sharing location')}${stat(S.hunts.filter(h=>h.state==='live').length+' of '+S.hunts.length,'hunts live')}</div>`;
}
let hd={leader:'',codes:'',type:'points',pts:10,x:2,min:10};
function hdSync(){
  const g=id=>document.getElementById(id); if(!g('hn-leader')) return;
  hd.leader=g('hn-leader').value; hd.codes=g('hn-codes').value;
  if(g('hn-pts')) hd.pts=parseInt(g('hn-pts').value,10)||hd.pts;
  if(g('hn-x')) hd.x=parseFloat(g('hn-x').value); if(g('hn-min')) hd.min=+g('hn-min').value;
}
const STATE_CHIP={pending:['warn','⏳ Waiting for their Okay'],declined:['neg','Said not now'],live:['ok','Live'],paused:['','Paused'],done:['ok','Finished']};
function huntsView(){
  const leaders=Object.values(S.leaders);
  let h=`<div class="card"><h3>New leader hunt</h3><div class="small mut">The leader gets a pop-up and a sound on their phone and must tap Okay before anything starts. Then kids see their location every 30 seconds. Each team that finds them gets the next code on your list.</div>
   <label>Leader</label><select id="hn-leader"><option value="">Choose a leader…</option>${leaders.map(l=>`<option value="${esc(l.key)}" ${hd.leader===l.key?'selected':''}>${esc(l.name)}${l.demo?' (demo)':''}${l.owner?' (owner)':''}</option>`).join('')}</select>
   <div class="small mut" style="margin-top:4px">Leaders show up here after they sign in on their phone.</div>
   <label>Codes, one per team, used in this order</label><div class="row"><input id="hn-codes" inputmode="numeric" placeholder="4821, 7302, 1159, 6644" value="${esc(hd.codes)}"><button data-act="hrand">Make list</button></div>
   <div class="small mut" style="margin-top:4px">Needs at least ${S.teams.length} different 4-digit codes. Once a team uses a code it is gone.</div>
   <label>Reward</label><div class="seg"><button class="${hd.type==='points'?'on':''}" data-act="hrew" data-v="points">Points</button><button class="${hd.type==='mult'?'on':''}" data-act="hrew" data-v="mult">Multiplier</button></div>
   ${hd.type==='points'?`<label>Points for each team that finds them</label><input id="hn-pts" type="number" min="1" value="${hd.pts}">`
   :`<div class="row"><div class="grow"><label>Times</label><select id="hn-x">${[2,2.5,3].map(x=>`<option ${hd.x===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
     <label>How long: <b id="hn-ml">${hd.min}</b> min</label><input id="hn-min" type="range" min="2" max="15" step="1" value="${hd.min}" style="padding:0">`}
   <div id="hn-err" class="small" style="color:var(--bad);margin-top:6px"></div>
   <button class="pri" style="width:100%;margin-top:10px" data-act="hcreate">Send request</button></div>`;
  if(S.hunts.length) h+=`<div class="row sp" style="margin-top:14px"><b>Hunts</b><span class="small mut">${S.hunts.filter(x=>x.state==='live').length} live</span></div>`;
  S.hunts.forEach(x=>{
    const pos=S.huntPos[x.id], sharing=!!S.locs[x.leaderKey], sc=STATE_CHIP[x.state]||['',x.state];
    h+=`<div class="card"><div class="row sp"><div><b>${esc(x.leaderName)}</b> <span class="chip ${sc[0]}">${sc[1]}</span></div><div class="big" style="letter-spacing:4px">${x.state==='done'?'—':esc(hcode(x))}</div></div>
     <div class="small mut">Reward: ${hrew(x)}</div>
     <div class="small" style="margin:4px 0">Codes: ${x.codes.map((c,i)=>`<span style="${i<x.ci?'text-decoration:line-through;opacity:.5':i===x.ci&&x.state!=='done'?'color:var(--accent);font-weight:700':''}">${esc(c)}</span>`).join(' · ')}</div>
     ${x.state==='live'?`<div class="small" style="margin:4px 0">${pos?`Last ping ${ago(pos.ts)}`:sharing?'Waiting for the first ping':'⚠ '+esc(x.leaderName)+' is not sharing location yet'}</div>`:''}
     <div>${S.teams.map(t=>`<span class="chip ${x.claims&&x.claims[t.id]?'ok':''}">${esc(t.short)} ${x.claims&&x.claims[t.id]?'✓':'…'}</span>`).join('')}</div>
     <div class="row" style="margin-top:8px">${x.state==='live'?`<button class="sm grow" data-act="htoggle" data-id="${x.id}">Pause</button>`:x.state==='paused'?`<button class="sm grow" data-act="htoggle" data-id="${x.id}">Resume</button>`:x.state==='declined'?`<button class="sm grow" data-act="htoggle" data-id="${x.id}">Ask again</button>`:''}<button class="sm bad" data-act="hdel" data-id="${x.id}">${x.state==='pending'?'Cancel':'Delete'}</button></div></div>`;
  });
  return h;
}

/* ================= DEMO TOOLS (simulated other teams) ================= */
let botTimer=null;
function openDemo(){
  openModal(`<h3 style="margin:0 0 6px">Demo tools</h3><div class="mut small" style="margin-bottom:10px">Prototype only. These simulate a busy camp so you can see the live parts without 20 phones.</div>
   <button class="${botTimer?'bad':'pri'}" style="width:100%" data-act="botsToggle">${botTimer?'Stop simulated teams':'Start simulated teams'}</button>
   <div class="small mut" style="margin:6px 0 12px">Bots wander the map, submit proof, and check in to pings.</div>
   <button style="width:100%;margin-bottom:8px" data-act="simoff">${simOffline?'Bring signal back':'Simulate no signal (this phone)'}</button>
   <button style="width:100%;margin-bottom:8px" data-act="setup">Open phone setup</button>
   <button class="bad" style="width:100%" data-act="reset">Reset everything</button>
   <button class="ghost" style="width:100%;margin-top:10px" data-act="mclose">Close</button>`);
}
function demoImg(t,x){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="320" height="240" fill="${t.color}" opacity=".35"/><rect width="320" height="240" fill="#0b1624" opacity=".55"/><text x="160" y="110" font-size="54" text-anchor="middle">📸</text><text x="160" y="160" fill="#fff" font-size="15" text-anchor="middle" font-family="sans-serif">${esc(t.short)} demo proof</text><text x="160" y="184" fill="#cfe6fb" font-size="11" text-anchor="middle" font-family="sans-serif">${esc(x.slice(0,34))}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function toggleBots(){
  if(botTimer){ clearInterval(botTimer); botTimer=null; return; }
  botTimer=setInterval(()=>{
    S=load()||S;
    const others=S.teams.filter(t=>!me||t.id!==me.teamId);
    if(!others.length||!S.gameOn) return;
    S.teams.forEach(t=>{ for(let i=0;i<2;i++){ const k='bot_'+t.id+i, l=S.locs[k]||{teamId:t.id,name:['Riley','Max','Kai','Zoe','Eli','Ava','Noah','Mia'][S.teams.indexOf(t)*2+i],x:580+Math.random()*30,y:423+Math.random()*30};
      const sp=SPOTS[(Math.floor(Date.now()/9000)+S.teams.indexOf(t)*2+i)%SPOTS.length];
      l.x+= (sp.x-l.x)*.12+(Math.random()-.5)*6; l.y+=(sp.y-l.y)*.12+(Math.random()-.5)*6; l.ts=Date.now(); S.locs[k]=l; }});
    const r=Math.random();
    const bt=others[Math.floor(Math.random()*others.length)];
    const live=S.pings.filter(p=>p.deadline>Date.now()&&(p.target==='all'||p.target===bt.id)&&!(p.checkins&&p.checkins[bt.id]));
    const fl=S.tasks.filter(x=>x.flash&&x.flash.deadline>Date.now()&&!x.off&&(x.flash.target==='all'||x.flash.target===bt.id)&&!subFor(bt.id,x.id));
    if(live.length&&r<.4){ claimPing(bt.id,live[0]); }
    else if(fl.length&&r<.6){ const x=fl[0];
      S.subs.push({id:uid(),taskId:x.id,teamId:bt.id,player:'Bot',ts:Date.now(),mult:multFor(bt.id),media:x.kind==='inperson'?[]:[{kind:'demo',src:demoImg(bt,x.text)}],note:'',status:'pending'});
      ev(`${bt.short} sent proof: ${x.text.slice(0,50)}`,['judge','leader']); }
    else if(r<.8){
      const avail=S.tasks.filter(x=>!x.off && !x.flash && (x.tier||1)<=tierOf(bt.id) && !subFor(bt.id,x.id));
      if(avail.length){ const x=avail[Math.floor(Math.random()*avail.length)];
        S.subs.push({id:uid(),taskId:x.id,teamId:bt.id,player:'Bot',ts:Date.now(),mult:multFor(bt.id),media:x.kind==='inperson'?[]:[{kind:'demo',src:demoImg(bt,x.text)}],note:'',status:'pending'});
        ev(`${bt.short} sent proof: ${x.text.slice(0,50)}`,['judge','leader']); }
    }
    save();
    const hh=activeHunts().filter(h=>!(h.claims&&h.claims[bt.id])); if(hh.length&&Math.random()<.1) claimHunt(bt.id,hh[0].id,hcode(hh[0]));
  },4000);
}

/* ================= TICK ================= */
let lastKey='';
function tick(force){
  const n=Date.now(); if(outbox.length&&online()) flushOutbox(); publishHuntPings(); autoAcceptDemo(); checkPingBuzz(); maybeHuntPrompt(); ensurePlayerShare(); pingPrompt(); gameTick(); sosTick(); revAuto();
  if(me&&me.role==='leader'&&S.help.some(h=>h.status==='open')&&n-sosPlayedAt>8000){ sosPlayedAt=n; snd('sos'); }
  const gc=$('#gclock'); if(gc) gc.textContent=clockText();
  document.querySelectorAll('[data-until]').forEach(el=>{ el.textContent=mmss(+el.dataset.until-n); });
  updateBoost();
  const g=S.mult.global;
  const key=S.pings.filter(p=>p.deadline>n).map(p=>p.id).join()+'|'+(g&&g.until>n?g.x:0)+'|'+Object.entries(S.mult.teams).filter(([k,t])=>t.until>n).map(([k,t])=>k+t.x).join()+'|'+S.tasks.filter(x=>x.flash&&x.flash.deadline>n&&!x.off).map(x=>x.id).join()+'|'+S.game.state+'|'+S.help.map(h=>h.id+h.status).join();
  if(!force && key!==lastKey){ lastKey=key; render(); } else lastKey=key;
}
setInterval(()=>tick(false),1000);
(async function init(){
  const d=await idbGet('draft'), ob=await idbGet('outbox'); if(Array.isArray(ob)) outbox=ob;
  if(!me && d){ const b=backup(); if(b){ me=b; try{ sessionStorage.setItem('th_me',JSON.stringify(b)); }catch(e){} } }
  toastNew(); render();
  if(d && me && task(d.taskId)){ draft=d; renderSubmit(); toast('Restored your unfinished submission.'); }
  else maybeSetup();
  flushOutbox();
})();
</script>
